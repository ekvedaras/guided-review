[package]
name = "guided-review"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Turn a PR diff into a top-down guided review"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3"
globset = "0.4.20"
gpui = { git = "https://github.com/zed-industries/zed", rev = "d38a754e1b6399a9a6ef26bbbdd95417b57eb988", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d38a754e1b6399a9a6ef26bbbdd95417b57eb988", package = "gpui_platform", features = ["font-kit", "runtime_shaders"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-highlight = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-php = "0.25.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
