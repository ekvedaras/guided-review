[package]
name = "guided-review"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ekvedaras/guided-review"
rust-version = "1.99"
publish = false
description = "Turn a PR diff into a top-down guided review"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3"
globset = "0.4.20"
gpui = { git = "https://github.com/zed-industries/zed", rev = "d38a754e1b6399a9a6ef26bbbdd95417b57eb988", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d38a754e1b6399a9a6ef26bbbdd95417b57eb988", package = "gpui_platform", features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
merman = { version = "=0.9.1", default-features = false, features = ["svg", "diagram-flowchart", "diagram-sequence", "diagram-state", "native-fonts"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-highlight = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-php = "0.25.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-segmentation = "1.12"
ureq = { version = "3.4.2", features = ["json"] }
usvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSEvent", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[features]
# Saves pictures of every screen when GUIDED_REVIEW_SNAPSHOTS names a folder.
snapshots = ["gpui_platform/test-support"]

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# panic-free
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"

# memory-lean
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "deny"
needless_collect = "deny"
format_collect = "deny"
format_push_string = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
or_fun_call = "deny"

# explicitness and idiom
let_underscore_must_use = "deny"
map_err_ignore = "deny"
str_to_string = "deny"
allow_attributes_without_reason = "deny"
use_self = "warn"
useless_let_if_seq = "warn"

# pedantic members left off: noise for a gpui app, or false alarms here
# cast_precision_loss: usize and u32 to f32 for pixel layout, where the precision is irrelevant
# struct_field_names: two hits, both good names (on_* callbacks, a collection named after its type)
# unused_self: rechecked in phase 4: the comment desk's stateless rules are associated functions now, the 12 left are view helpers and test fixtures that are methods on their owner on purpose
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unreadable_literal = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
unused_self = "allow"
fn_params_excessive_bools = "allow"
