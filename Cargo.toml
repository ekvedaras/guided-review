[package]
name = "guided-review"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Turn a PR diff into a top-down guided review"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-php = "0.25.1"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
