disallowed-methods = [
    { path = "gpui::deferred", reason = "build a floating panel with app::components::overlay::popover, which occludes what is under it (#133)" },
    { path = "gpui::app::App::open_url", reason = "open links with app::code_links, so code opens where the CodeOpener decides" },
]
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true
avoid-breaking-exported-api = false
