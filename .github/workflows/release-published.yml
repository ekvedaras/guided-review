name: Release published

# The notes go once the release is published, not when its draft is made: until then the tag may still
# move to a fix, and a tag moved past the deletion would find no notes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose notes to delete, like v0.9.0
        required: true

permissions:
  contents: write

jobs:
  delete-change-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        # The commit goes through the API, not git push: GitHub signs it, and main requires signed commits.
        run: |
          notes=$(scripts/change-notes-in "$(scripts/previous-release-tag "$TAG")" "$TAG")
          deletions=$(for note in $notes; do
            if [ -f "$note" ]; then jq -n --arg path "$note" '{path: $path}'; fi
          done | jq -s .)
          [ "$deletions" != "[]" ] || exit 0
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$(git rev-parse HEAD)" \
            --arg headline "changes: the notes released in $TAG are gone from changes/; they stay readable at the tag" \
            --argjson deletions "$deletions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {deletions: $deletions}
              }}
            }' | gh api graphql --input -
